services:
  - type: web
    name: lloyds-clone
    runtime: static
    branch: master
    # `--prod=false` keeps devDependencies (babel, typescript) that the metro
    # bundler needs even when Render sets NODE_ENV=production.
    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile --prod=false && pnpm run build:web
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    buildFilter:
      ignoredPaths:
        - screenshots/**
        - README.md
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # Base URL of the companion Express API (no trailing slash), e.g. https://your-api.onrender.com
      - key: EXPO_PUBLIC_API_URL
        sync: false
    headers:
      # Bundles, fonts and images are content-hashed, so they can be cached hard.
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The shell is not hashed and points at the current bundle.
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # `web.output` is "single", so every route is served by the SPA shell.
      # Without this, deep links such as /account/<id> would 404.
      - type: rewrite
        source: /*
        destination: /index.html
