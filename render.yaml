services:
  - type: web
    name: lloyds-clone
    runtime: static
    branch: master
    buildCommand: corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm expo export --platform web
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    buildFilter:
      ignoredPaths:
        - screenshots/**
        - README.md
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      # Base URL of the companion Express API (no trailing slash), e.g. https://your-api.onrender.com
      - key: EXPO_PUBLIC_API_URL
        sync: false
    headers:
      - path: /_expo/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Expo Router emits a static HTML file per route; fall back to the SPA
      # entry for dynamic routes such as /details/[accountId].
      - type: rewrite
        source: /*
        destination: /index.html
